<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopCart · Recommendation Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <a class="logo" href="#/">ShopCart</a>
      <form class="search" id="search-form" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="search" placeholder="Search for products, brands and more..." aria-label="Search">
      </form>
      <div class="top-actions">
        <a class="top-link" href="#/insights" title="Pipeline metrics and offline evaluation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Insights</span>
        </a>
        <a class="top-link" href="#/cart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
          <span>Cart</span><b class="badge" id="cart-count" hidden>0</b>
        </a>
        <div class="account">
          <button class="top-link" id="account-button" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
            <span id="account-label">Account</span>
          </button>
          <div class="account-menu" id="account-menu" hidden></div>
        </div>
        <button class="debug-toggle" id="debug-toggle" title="Show / hide the recommendation debug panel">
          <span class="dot"></span> Debug
        </button>
      </div>
    </div>
    <nav class="catnav" id="catnav" aria-label="Categories"></nav>
  </header>

  <main id="main" class="main"></main>

  <aside class="debug" id="debug" aria-label="Recommendation debug panel">
    <div class="debug-head">
      <h2>Recommendation Debug</h2>
      <span class="live" id="live-badge"><span class="dot"></span><span id="live-text">Connecting</span></span>
      <button class="icon-btn" id="debug-close" aria-label="Close debug panel">✕</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="item" aria-selected="true">Item Analysis</button>
      <button role="tab" data-tab="user" aria-selected="false">User Profile</button>
      <button role="tab" data-tab="similar" aria-selected="false">Similar Items</button>
    </div>
    <div class="debug-body" id="debug-body"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <script src="/static/app.js"></script>
</body>
</html>
